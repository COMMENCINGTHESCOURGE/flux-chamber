# Standard labels for COMMENCINGTHESCOURGE repositories
# Sync with: https://github.com/EndBug/label-sync
#
# Required by bounty infrastructure (issue #1):
#   bug, enhancement, bounty, documentation, wontfix

- name: bug
  color: "d73a4a"
  description: "Something isn't working"

- name: enhancement
  color: "a2eeef"
  description: "New feature or request"

- name: bounty
  color: "0e8a16"
  description: "Has a monetary bounty attached"

- name: documentation
  color: "0075ca"
  description: "Improvements or additions to documentation"

- name: wontfix
  color: "ffffff"
  description: "This will not be worked on"

- name: meta
  color: "d4c5f9"
  description: "Repository infrastructure and process"

- name: good first issue
  color: "7057ff"
  description: "Good for newcomers"

- name: help wanted
  color: "008672"
  description: "Extra attention is needed"
